apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: country-http-route
  namespace: country-app
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - country.local       
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: country-service   
          port: 8000